name: Automatyczna Aktualizacja Wyników Multi Multi

on:
  workflow_dispatch: # Pozwala na ręczne uruchomienie w razie potrzeby
  schedule:
    - cron: '35 12,20 * * *' # 12:35 UTC = 14:35 czasu polskiego, 20:35 UTC = 22:35 czasu polskiego

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja zależności
        run: |
          pip install pandas requests

      - name: Uruchomienie skryptu pobierającego wyniki
        run: python update_script.py

      - name: Zapis i commit zmian w bazie CSV
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Automatyczna aktualizaja wyników losowania'
          branch: main
