name: Automatyczna Aktualizacja Wyników Multi Multi

on:
  schedule:
    - cron: '10 12,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v3

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalacja bibliotek
        run: pip install requests pandas

      - name: Uruchomienie skryptu pobierającego
        run: python update.py

      - name: Zapis i wysłanie zmian do GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add "multi_multi (10).csv"
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna aktualizacja wyników po losowaniu" && git push)
