name: Automatyczna Aktualizacja Wyników Multi Multi

on:
  schedule:
    - cron: '30 12 * * *'
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v3

      - name: Skonfiguruj Pythona
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Pobierz najnowsze wyniki i zaktualizuj plik CSV
        run: |
          python -c "
          import requests
          import pandas as pd

          url = 'https://www.mbnet.com.pl/dl.txt'
          headers = {'User-Agent': 'Mozilla/5.0'}
          try:
              res = requests.get(url, headers=headers, timeout=15)
              if res.status_code == 200:
                  lines = res.text.strip().split('\n')
                  parsed = [line.strip().split() for line in lines if len(line.strip().split()) >= 10]
                  if parsed:
                      df = pd.DataFrame(parsed)
                      df.to_csv('multi_multi (9).csv', index=False, header=False)
                      print('Plik CSV zaktualizowany pomyślnie!')
          except Exception as e:
              print('Błąd podczas pobierania:', e)
          "

      - name: Zapisz zmiany w repozytorium
        run: |
          git config --global user.name "Auto Bot"
          git config --global user.email "bot@github.com"
          git add "multi_multi (9).csv"
          git commit -m "🤖 Automatyczna aktualizacja wyników Multi Multi [skip ci]" || exit 0
          git push
