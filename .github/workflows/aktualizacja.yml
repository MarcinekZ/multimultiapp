name: Automatyczna Aktualizacja Wyników Multi Multi

on:
  workflow_dispatch:
  schedule:
    - cron: '45 12,21 * * *'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja zależności
        run: |
          pip install pandas requests

      - name: Uruchomienie skryptu pobierającego wyniki
        run: python update.py

      - name: Zapis i commit zmian w bazie CSV
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Automatyczna aktualizacja wyników losowania'
          branch: main
